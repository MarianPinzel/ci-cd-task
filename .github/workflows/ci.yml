name: CI - PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Unit tests
        working-directory: app
        run: npm test

      - name: Build container image (not pushed)
        working-directory: app
        run: docker build -t ci-cd-task-app:pr-${{ github.event.pull_request.number }} .

      - name: Smoke test the container locally
        run: |
          docker run -d --rm -p 8080:8080 --name smoke-test \
            -e APP_ENV=ci ci-cd-task-app:pr-${{ github.event.pull_request.number }}
          sleep 2
          curl -sf "http://localhost:8080/health"
          docker stop smoke-test

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dependency vulnerability scan
        working-directory: app
        run: npm audit --audit-level=high

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scanning
        working-directory: app
        run: docker build -t ci-cd-task-app:scan .

      - name: Container image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ci-cd-task-app:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
