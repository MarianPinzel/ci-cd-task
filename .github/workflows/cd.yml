name: CD - build, deploy Dev, promote to Prod

# Runs on every push to main. Builds one versioned artifact, deploys it to
# Dev automatically, then - only if Dev succeeds and a required reviewer
# approves the `production` GitHub Environment - promotes the *same* image
# to Prod (no rebuild, so what was tested is exactly what ships).
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Unit tests
        working-directory: app
        run: npm test

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency vulnerability scan
        working-directory: app
        run: npm audit --audit-level=high
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push-image:
    name: push-image
    needs: [build-and-test, security-scan]
    runs-on: ubuntu-latest
    environment: dev # grants OIDC access to the ECR push role, nothing else
    permissions:
      id-token: write
      contents: read
    outputs:
      image_uri: ${{ steps.tag.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        working-directory: app
        run: docker build -t "$ECR_REGISTRY_REPO:${{ github.sha }}" .
        env:
          ECR_REGISTRY_REPO: ${{ vars.ECR_REPOSITORY }}

      - name: Vulnerability scan before publishing
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: '${{ vars.ECR_REPOSITORY }}:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Push versioned image to the private registry
        id: tag
        run: |
          docker push "${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "image_uri=${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: deploy-dev
    needs: push-image
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy image to Dev Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --image-uri "${{ needs.push-image.outputs.image_uri }}"
          aws lambda wait function-updated \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"

      - name: Smoke test Dev
        run: |
          aws lambda invoke --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --payload '{}' --cli-binary-format raw-in-base64-out out.json
          cat out.json
          grep -q '"statusCode": 200' out.json

  # `environment: production` is where promotion is actually gated: the
  # GitHub Environment (see terraform/github/environments.tf) requires a
  # manual approval from the configured reviewers before this job starts.
  deploy-prod:
    name: deploy-prod
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Promote the same image to Prod Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --image-uri "${{ needs.push-image.outputs.image_uri }}"
          aws lambda wait function-updated \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"

      - name: Smoke test Prod
        run: |
          aws lambda invoke --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --payload '{}' --cli-binary-format raw-in-base64-out out.json
          cat out.json
          grep -q '"statusCode": 200' out.json
