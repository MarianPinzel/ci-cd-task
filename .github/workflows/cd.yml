name: CD - build, deploy Dev, promote to Prod

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Unit tests
        working-directory: app
        run: npm test

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency vulnerability scan
        working-directory: app
        run: npm audit --audit-level=high
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push-image:
    name: push-image
    needs: [build-and-test, security-scan]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    outputs:
      image_uri: ${{ steps.tag.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        working-directory: app
        run: docker build -t "$ECR_REGISTRY_REPO:${{ github.sha }}" .
        env:
          ECR_REGISTRY_REPO: ${{ vars.ECR_REPOSITORY }}

      - name: Vulnerability scan before publishing
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: '${{ vars.ECR_REPOSITORY }}:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Push versioned image to the private registry
        id: tag
        run: |
          docker push "${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "image_uri=${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: deploy-dev
    needs: push-image
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition "${{ vars.ECS_SERVICE_NAME }}" \
            --query taskDefinition > task-definition.json

      - name: Render new task definition with the built image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ needs.push-image.outputs.image_uri }}

      - name: Deploy to Dev
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Smoke test Dev
        run: |
          TASK_ARN=$(aws ecs list-tasks --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --service-name "${{ vars.ECS_SERVICE_NAME }}" --query 'taskArns[0]' --output text)
          ENI_ID=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER_NAME }}" --tasks "$TASK_ARN" \
            --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' --output text)
          PUBLIC_IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI_ID" \
            --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
          curl -sf "http://$PUBLIC_IP:8080/health"

  deploy-prod:
    name: deploy-prod
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition "${{ vars.ECS_SERVICE_NAME }}" \
            --query taskDefinition > task-definition.json

      - name: Render task definition with the image already validated in Dev
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ needs.push-image.outputs.image_uri }}

      - name: Promote to Prod
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Smoke test Prod
        run: |
          TASK_ARN=$(aws ecs list-tasks --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --service-name "${{ vars.ECS_SERVICE_NAME }}" --query 'taskArns[0]' --output text)
          ENI_ID=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER_NAME }}" --tasks "$TASK_ARN" \
            --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' --output text)
          PUBLIC_IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI_ID" \
            --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
          curl -sf "http://$PUBLIC_IP:8080/health"
